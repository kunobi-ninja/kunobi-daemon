[tools]
# The test runner. nextest runs every test in its own process, so process-wide
# state (inherited descriptors, signal dispositions, spawned children) cannot
# leak from one test into another the way it does between libtest's threads.
#
# The exact pin is load-bearing: this repo cuts several tag series
# (cargo-nextest-*, nextest-runner-*, nextest-filtering-*) and the runner tags
# sort newest, so a floating version resolves to the wrong artifact. The
# version is the full tag.
"github:nextest-rs/nextest" = "cargo-nextest-0.9.140"

# Mutation testing (see .cargo/mutants.toml). The repo mixes tag series
# ("v27.1.0" and older "cargo-mutants-v26.1.x"), so this pins the full tag as
# nextest does above.
[tools."github:sourcefrog/cargo-mutants"]
version = "v27.1.0"

# Upstream publishes no arm64 macOS build. Without this, mise refuses the x86_64
# asset and `mise install` fails on Apple silicon, the macOS CI runner included.
# The x86_64 binary runs under Rosetta 2.
[tools."github:sourcefrog/cargo-mutants".platforms]
macos-arm64 = { asset_pattern = "cargo-mutants-x86_64-apple-darwin.tar.gz" }
