[package]
name = "kunobi-daemon"
version = "0.10.2"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Process ownership, request draining, and verified upgrades for local daemons"
repository = "https://github.com/kunobi-ninja/kunobi-daemon"
readme = "README.md"
keywords = ["daemon", "ipc", "lifecycle", "protobuf"]
categories = ["os", "asynchronous"]
# Benchmarks are a separate package in benches/ (see docs/benchmarks.md), so
# their tooling never reaches this crate's dependency graph or MSRV.
autobenches = false

[package.metadata.docs.rs]
all-features = true

[features]
default = ["async"]
async = ["dep:tokio", "tokio/macros"]
wire = ["dep:buffa"]
# With `async`, `local::ProcessHandle` waits for an exit through Tokio's reactor
# and `local::shutdown_signal` waits for a stop request.
local = ["dep:interprocess", "dep:socket2", "dep:widestring", "dep:windows-sys", "tokio?/net", "tokio?/signal"]
local-async = ["local", "async", "interprocess/tokio"]
wire-async = ["wire", "async", "tokio/io-util"]
# Stdio clients that may start the daemon. Off by default so a process that
# only binds and serves does not compile spawn helpers.
launch = ["local"]

[dependencies]
buffa = { version = "=0.9.2", optional = true, default-features = false, features = ["std"] }
tokio = { version = "1.54.1", optional = true, features = ["sync", "time", "rt"] }

[target.'cfg(unix)'.dependencies]
# Always on Unix: record reads open with O_NOFOLLOW | O_NONBLOCK.
libc = "0.2"
socket2 = { version = "0.6", optional = true }

[target.'cfg(windows)'.dependencies]
widestring = { version = "1.2", optional = true }
interprocess = { version = "2.4.3", optional = true, default-features = false }
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[target.'cfg(loom)'.dependencies]
# Model-checked builds only: RUSTFLAGS="--cfg loom" with --no-default-features,
# because Tokio reacts to cfg(loom) internally.
loom = "0.7"

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
tempfile = "3"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "test-util", "net", "io-util"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
# Kani sets cfg(kani) for its harnesses and the loom job sets cfg(loom);
# declare both so check-cfg does not warn.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(loom)'] }

[lints.clippy]
disallowed_methods = "deny"
# Nearly all of this crate's unsafe is FFI into Win32 and libc, where the
# invariant lives in the platform's documentation rather than in Rust's types.
# A block without that justification written down should fail the build.
undocumented_unsafe_blocks = "deny"

[[example]]
name = "application_messages"
required-features = ["wire"]

[[example]]
name = "lifecycle_server"
required-features = ["wire-async", "local-async"]

[[example]]
name = "blocking_health"
required-features = ["wire", "local"]

[[example]]
name = "managed_daemon"
required-features = ["wire", "local"]

[[example]]
name = "ipc_bench"
required-features = ["wire-async", "launch"]
