# cargo-mutants settings, shared by local runs and CI. See https://mutants.rs/
# and the "Mutation testing" section of README.md.

# nextest runs each test in its own process, as the regular test job does. The
# `mutants` profile in .config/nextest.toml stops at the first failure.
test_tool = "nextest"
additional_cargo_test_args = ["--profile", "mutants"]
additional_cargo_args = ["--locked"]

# Most of the crate sits behind features; mutate and test all of it at once.
all_features = true

# The unmutated suite takes about 8 s on a GitHub-hosted Linux runner. A test
# timeout of 3x the baseline, and never under 30 s, leaves room for a noisy
# runner without letting a mutant that hangs a test cost more than that.
timeout_multiplier = 3.0
minimum_test_timeout = 30.0

# cargo-mutants reads every module regardless of `cfg`, so code the Linux CI
# lane never compiles would report every mutant as missed. Whole files that are
# Windows-only are excluded here; they are built and tested by the Windows jobs.
# A missed mutant inside a macOS or Windows branch of a shared function has the
# same cause and should be excluded by name, with the reason, in `exclude_re`.
exclude_globs = [
    # Generated by buffa-codegen from proto/lifecycle.proto. The Protobuf schema
    # job checks it is current; its encoders are the generator's code.
    "src/wire/generated.rs",
    "src/local/windows.rs",
    "src/local/windows_socket.rs",
    "src/local/windows_spawn.rs",
    "src/local/peer/windows.rs",
    "src/serve/windows.rs",
    "src/local/process/windows.rs",
    # macOS and the BSDs; the macOS test job builds and tests it.
    "src/local/process/kqueue.rs",
    # Unix systems CI does not run on.
    "src/local/process/unsupported.rs",
]

exclude_re = [
    # Kani harnesses (`#[cfg(kani)] mod proofs`) are compiled only by
    # `cargo kani`, which the Kani proofs job runs. The code they verify stays
    # in scope here. Any file, so a new harness needs no entry of its own.
    '^src/.*\.rs:.*\bproofs::',
    # Test-only helpers behind `#[cfg(all(test, feature = "launch"))]`.
    # cargo-mutants skips `#[cfg(test)]` but does not recognise `test` inside
    # `all(...)`, so it would mutate the tests' own fixtures.
    '^src/local/unix\.rs:.*\b(interrupt_process_group|inheritable_pipe)\b',
    # Built only without the `local` feature, and mutants are tested with all
    # features. The `--no-default-features` test runs still exercise it.
    '^src/warmup\.rs:.*\bpolled_exit_by\b',
]
