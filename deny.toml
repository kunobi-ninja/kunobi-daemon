# Same policy as kache: RustSec advisories, yanked versions, an explicit
# licence allow-list, and crates.io as the only source.

[graph]
# Check every feature combination the crate ships, not only the defaults.
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[licenses]
# Only licences that actually occur in the graph, so a new one needs a
# deliberate edit here.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "Unicode-3.0",
    "0BSD", # doctest-file, recvmsg (via interprocess)
    "Zlib", # foldhash (via buffa)
]
confidence-threshold = 0.93
exceptions = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
